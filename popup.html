<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabYell</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <div class="header-left">
          <h1><span>Tab</span><span class="brand-yell">Yell</span><span class="sound-mark" aria-hidden="true">🔊</span></h1>
          <p class="subtitle">Silenzio sospetto. Per ora.</p>
        </div>
        <button id="settingsToggle" class="settings-btn" title="Impostazioni TabYell" aria-label="Apri le impostazioni di TabYell">⚙️</button>
      </header>

      <section class="count-wrap" aria-label="Numero di tab aperte">
        <div id="tabCount" class="count">0</div>
        <div class="count-label">tab aperte</div>
      </section>

      <section class="meter-wrap">
        <div class="meter-track">
          <div id="meterFill" class="meter-fill"></div>
        </div>
        <div id="meterHint" class="meter-hint">Tutto tranquillo</div>
      </section>

      <section class="controls">
        <label class="row toggle-row">
          <span>TabYell attivo</span>
          <input id="enabled" type="checkbox" />
        </label>

        <label class="row" for="threshold">
          <span>Soglia: <strong id="thresholdValue">15</strong> tab</span>
        </label>
        <input id="threshold" type="range" min="1" max="50" step="1" value="15" />

        <label class="row" for="language">
          <span>Lingua della voce</span>
        </label>
        <select id="language">
          <option value="it">🇮🇹 Italiano</option>
          <option value="en">🇬🇧 English</option>
        </select>

        <label class="row" for="phraseMode">
          <span>Stile delle frasi</span>
        </label>
        <select id="phraseMode">
          <option value="both">🎲 Misto</option>
          <option value="with-count">🔢 Con numero di tab</option>
          <option value="without-count">💬 Senza numero</option>
        </select>
      </section>

      <section class="stats">
        <span>Sgridate ricevute:</span>
        <strong id="totalYells">0</strong>
      </section>

      <button id="yellNow" class="yell-btn">🔊 Sgridami adesso</button>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
